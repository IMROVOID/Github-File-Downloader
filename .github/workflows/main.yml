---
name: ⬇️ 01 - Download URL
on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 Download URLs (separate by space)'
        required: false
        type: string
      mode:
        description: '📦 Download mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      part_size_mb:
        description: '📦 Size of each split part in MB (10–90)'
        required: false
        default: '45'
        type: string
      password:
        description: '🔒 Password for archive (optional)'
        required: false
        default: ''
        type: string
      compression_preset:
        description: '📊 Size Preset (Compression Level, Default: Auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - best
          - great
          - good
          - fast
          - fastest
env:
  CODES_URL: ""
jobs:
  save-file:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours
    permissions:
      contents: write
    steps:
      # --- Step 1: Check URL Input ---
      - name: Check URL provided
        id: check_urls
        run: |
          if [ -z "${{ github.event.inputs.urls }}" ]; then
            echo ""
            echo "❌ No download URL provided!"
            echo ""
            echo "📌 How to use:"
            echo " 1️⃣ Re-run this workflow"
            echo " 2️⃣ Enter the file URL in the 'Download URLs' field"
            echo " 3️⃣ For multiple files, separate URLs with spaces"
            echo ""
            exit 1
          fi
          echo "✅ URL received"
      # --- Step 2: Checkout and Setup ---
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      # --- Step 3: Configuration & Dependencies ---
      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Git configured for large file handling"
      - name: Install aria2, p7zip-full, curl, bc
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full curl bc
      # --- Step 4: Core Download Logic ---
      - name: Downloader - Start
        run: |
          echo "🏷️ GitHub File Downloader - Enhanced Version"
          echo ""
      - name: Download files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          URLS="${{ github.event.inputs.urls }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"
          PART_SIZE_MB_RAW="${{ github.event.inputs.part_size_mb }}"
          COMPRESSION_PRESET="${{ github.event.inputs.compression_preset }}"
          
          # Validate and clamp part size between 10 and 90 MB
          if [[ -z "$PART_SIZE_MB_RAW" ]]; then
            PART_SIZE_MB=45
          else
            PART_SIZE_MB=$(( PART_SIZE_MB_RAW ))
            if [ $PART_SIZE_MB -lt 10 ]; then
              PART_SIZE_MB=10
            elif [ $PART_SIZE_MB -gt 90 ]; then
              PART_SIZE_MB=90
            fi
          fi
          
          SPLIT_THRESHOLD_BYTES=$(( PART_SIZE_MB * 1024 * 1024 ))
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          
          echo "Downloading with mode: $MODE"
          echo "Part size: ${PART_SIZE_MB} MB"
          echo "Compression preset: ${COMPRESSION_PRESET}"
          
          if [ -n "$ZIP_PASSWORD" ]; then
            echo "Password protection: ENABLED"
          else
            echo "Password protection: DISABLED"
          fi
          
          CPU_CORES=$(nproc)
          MAX_ARCHIVE_TIME_SEC=19800 # 5.5 hours
          mkdir -p downloads tmp_downloads
          
          # Keep-alive function
          keepalive_exec() {
            local desc="$1"; shift
            echo "$desc starting..."
            "$@" > /dev/null 2>&1 &
            local pid=$!
            while kill -0 $pid 2>/dev/null; do
              echo "$desc still running ($(date))"
              sleep 30
            done
            wait $pid
            local ret=$?
            echo "$desc finished with exit code $ret"
            return $ret
          }
          
          RANDOM_WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river" "ocean" "mountain")
          get_random_word() {
            echo "${RANDOM_WORDS[$RANDOM % ${#RANDOM_WORDS[@]}]}_$RANDOM"
          }
          
          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ] || [ -d "$BACKUP_DIR/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          # Enhanced: Get actual filename from URL (following redirects + Content-Disposition)
          get_actual_filename() {
            local URL="$1"
            local DEFAULT_NAME="$2"
            local FINAL_NAME=""
            
            # Try to get filename from headers
            FINAL_NAME=$(curl -s -L -I -A "Mozilla/5.0" "$URL" 2>/dev/null | grep -i "content-disposition" | grep -oE 'filename[^;=\n]*=([^;=\n]*)' | sed 's/.*=//; s/"//g; s/^[[:space:]]*//; s/[[:space:]]*$//' | tail -n1)
            
            if [ -z "$FINAL_NAME" ]; then
              # Fallback: parse final URL after redirects
              FINAL_URL=$(curl -s -L -I -o /dev/null -w "%{url_effective}" -A "Mozilla/5.0" "$URL" 2>/dev/null)
              FINAL_NAME=$(basename "$FINAL_URL" | sed 's/%20/ /g' | sed 's/%2F/-/g' | sed 's/[?#].*//')
            fi
            
            if [ -z "$FINAL_NAME" ] || [[ "$FINAL_NAME" == "/"* ]] || [[ "$FINAL_NAME" == "."* ]]; then
              FINAL_NAME="$DEFAULT_NAME"
            fi
            
            # Sanitize
            FINAL_NAME=$(echo "$FINAL_NAME" | sed 's/[<>:"|?*]/_/g')
            echo "$FINAL_NAME"
          }
          
          create_error_file() {
            local FILENAME="$1"
            local ERROR_MSG="$2"
            local URL="$3"
            local BASENAME_NO_EXT="${FILENAME%.*}"
            local FOLDER_NAME=$(get_unique_folder "$BACKUP_DIR" "$BASENAME_NO_EXT")
            mkdir -p "$BACKUP_DIR/$FOLDER_NAME"
            {
              echo "# ${FILENAME} - Download Failed"
              echo ""
              echo "---"
              echo ""
              echo "## Download Information"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **File** | \`${FILENAME}\` |"
              echo "| **URL** | ${URL} |"
              echo "| **Date** | $(date '+%Y-%m-%d %H:%M:%S UTC') |"
              echo "| **Status** | <span style=\"color:red\">**FAILED**</span> |"
              echo ""
              echo "---"
              echo ""
              echo "## Error Details"
              echo ""
              echo "\`\`\`"
              echo "$ERROR_MSG"
              echo "\`\`\`"
              echo ""
              echo "---"
              echo ""
              echo "## Possible Solutions"
              echo ""
              echo "- Check if the URL is correct and accessible"
              echo "- The file may have been removed or moved"
              echo "- The server may require authentication"
              echo "- Some servers block automated downloads (403 Forbidden)"
              echo "- Try again later if it is a temporary server issue"
              echo ""
              echo "---"
              echo ""
              echo "*This tool is provided as is*"
            } > "$BACKUP_DIR/$FOLDER_NAME/README.md"
            echo "Error file created: $BACKUP_DIR/$FOLDER_NAME/README.md"
          }
          
          download_with_retry() {
            local URL="$1"
            local FILENAME="$2"
            local MAX_RETRIES=3
            local RETRY_DELAY=5
            local SUCCESS=false
            local ERROR_LOG=""
            
            rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
            
            for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
              echo "Attempt $attempt of $MAX_RETRIES for $FILENAME"
              rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
              
              ERROR_LOG=$(aria2c \
                --split=2 \
                --max-connection-per-server=2 \
                --min-split-size=20M \
                --max-tries=3 \
                --retry-wait=5 \
                --timeout=60 \
                --connect-timeout=30 \
                --follow-torrent=false \
                --check-certificate=false \
                --allow-overwrite=true \
                --auto-file-renaming=false \
                --dir="tmp_downloads" \
                --out="$FILENAME" \
                "$URL" 2>&1)
              
              if [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
                SUCCESS=true
                echo "aria2c download successful: $FILENAME"
                break
              fi
              
              rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
              echo "aria2c failed, trying curl fallback..."
              
              ERROR_LOG=$(curl -L -f -# \
                --retry 3 \
                --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 3600 \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                -o "tmp_downloads/$FILENAME" \
                "$URL" 2>&1)
              
              if [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
                SUCCESS=true
                echo "curl download successful: $FILENAME"
                break
              fi
              
              rm -f "tmp_downloads/$FILENAME"
              echo "Attempt $attempt failed. Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            done
            
            if [ "$SUCCESS" = true ] && [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
              return 0
            fi
            
            rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
            create_error_file "$FILENAME" "Download failed after $MAX_RETRIES attempts. Last error: $ERROR_LOG" "$URL"
            return 1
          }
          
          # Download all files with proper naming
          declare -A ORIGINAL_FILENAMES
          DOWNLOADED_FILES=()
          
          for URL in $URLS; do
            DEFAULT_NAME=$(basename "$URL" | sed 's/%20/ /g' | sed 's/%2F/-/g' | sed 's/[?#].*//')
            DEFAULT_NAME=$(echo "$DEFAULT_NAME" | sed 's/[<>:"|?*]/_/g')
            ACTUAL_NAME=$(get_actual_filename "$URL" "$DEFAULT_NAME")
            
            if [ ${#ACTUAL_NAME} -gt 50 ]; then
              EXT="${ACTUAL_NAME##*.}"
              BASE="${ACTUAL_NAME%.*}"
              ACTUAL_NAME="${BASE:0:46}.${EXT}"
            fi
            
            echo "Downloading $URL -> $ACTUAL_NAME"
            download_with_retry "$URL" "$ACTUAL_NAME" || echo "Failed to download: $ACTUAL_NAME"
            
            if [ -f "tmp_downloads/$ACTUAL_NAME" ] && [ -s "tmp_downloads/$ACTUAL_NAME" ]; then
              DOWNLOADED_FILES+=("$ACTUAL_NAME")
              ORIGINAL_FILENAMES["$ACTUAL_NAME"]="$ACTUAL_NAME"
            fi
          done
          
          # Determine final mode with fallback logic
          FINAL_MODE="$MODE"
          NEEDS_FALLBACK=false
          
          if [ "$MODE" = "normal" ]; then
            for f in tmp_downloads/*; do
              [ -f "$f" ] || continue
              SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 94371840 ]; then  # 90MB
                NEEDS_FALLBACK=true
                break
              fi
            done
          fi
          
          if [ "$NEEDS_FALLBACK" = true ]; then
            echo "⚠️ One or more files exceed 90MB. Falling back to Zip mode for all files."
            FINAL_MODE="zip"
          fi
          
          # ---------- Compression level selector ----------
          determine_compression_level() {
            local TOTAL_SIZE="$1"
            local PRESET="$2"
            local CORES="$3"
            case "$PRESET" in
              best) echo 9; return ;;
              great) echo 7; return ;;
              good) echo 5; return ;;
              fast) echo 3; return ;;
              fastest) echo 1; return ;;
            esac
            # Auto logic (simplified)
            echo 5
          }
          
          # ---------- Archive creation ----------
          create_high_ratio_archive() {
            local SOURCE_PATH="$1"
            local OUTPUT_BASE="$2"
            local SPLIT_SIZE_MB="$3"
            local IS_DIRECTORY="$4"
            local PASSWORD="$5"
            local MX_LEVEL="$6"
            local -a CMD_ARGS=(7z a -t7z -mx=${MX_LEVEL} -mmt=on)
            
            if [ -n "$PASSWORD" ]; then
              CMD_ARGS+=(-p"$PASSWORD")
            fi
            if [ -n "$SPLIT_SIZE_MB" ] && [ "$SPLIT_SIZE_MB" -gt 0 ]; then
              CMD_ARGS+=(-v${SPLIT_SIZE_MB}m)
            fi
            if [ "$IS_DIRECTORY" = "yes" ]; then
              CMD_ARGS+=("${OUTPUT_BASE}.7z" "$SOURCE_PATH/")
            else
              CMD_ARGS+=("${OUTPUT_BASE}.7z" "$SOURCE_PATH")
            fi
            keepalive_exec "7z archive" "${CMD_ARGS[@]}"
          }
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # Process according to final mode
          if [ "$FINAL_MODE" = "zip" ]; then
            if [ -n "$(ls -A tmp_downloads 2>/dev/null)" ]; then
              if [ ${#DOWNLOADED_FILES[@]} -eq 1 ]; then
                ORIG_NAME="${DOWNLOADED_FILES[0]}"
                ARCHIVE_NAME="${ORIG_NAME%.*}"
                if [ ${#ARCHIVE_NAME} -gt 50 ]; then
                  ARCHIVE_NAME="${ARCHIVE_NAME:0:46}"
                fi
              else
                ARCHIVE_NAME="download_${TIMESTAMP}"
              fi
              
              FOLDER_NAME=$(get_unique_folder "$BACKUP_DIR" "$ARCHIVE_NAME")
              mkdir -p "$BACKUP_DIR/$FOLDER_NAME"
              
              TEMP_ARCHIVE_DIR="/tmp/7z_temp_$$"
              mkdir -p "$TEMP_ARCHIVE_DIR"
              
              VALID_FILES=0
              TOTAL_SIZE=0
              for f in tmp_downloads/*; do
                if [ -f "$f" ] && [ -s "$f" ]; then
                  cp "$f" "$TEMP_ARCHIVE_DIR/"
                  VALID_FILES=$((VALID_FILES + 1))
                  FSIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
                  TOTAL_SIZE=$((TOTAL_SIZE + FSIZE))
                fi
              done
              
              if [ $VALID_FILES -gt 0 ]; then
                MX_LEVEL=$(determine_compression_level "$TOTAL_SIZE" "$COMPRESSION_PRESET" "$CPU_CORES")
                ARCHIVE_BASE="$BACKUP_DIR/$FOLDER_NAME/$ARCHIVE_NAME"
                create_high_ratio_archive "$TEMP_ARCHIVE_DIR" "$ARCHIVE_BASE" "$PART_SIZE_MB" "yes" "$ZIP_PASSWORD" "$MX_LEVEL"
                rm -rf "$TEMP_ARCHIVE_DIR"
                
                # Generate detailed README
                PARTS_COUNT=$(ls "$BACKUP_DIR/$FOLDER_NAME/"*.7z.* 2>/dev/null | wc -l)
                if [ "$PARTS_COUNT" -gt 0 ]; then
                  FOLDER_ENCODED=$(urlencode "${FOLDER_NAME}")
                  RAW_BASE="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads"
                  
                  DOWNLOAD_LINKS_MD=""
                  ALL_LINKS=""
                  LINK_NUM=0
                  TOTAL_ARCHIVE_SIZE=0
                  
                  for part_file in $(ls "$BACKUP_DIR/$FOLDER_NAME/"*.7z.* 2>/dev/null | sort); do
                    PART_BASENAME=$(basename "$part_file")
                    PART_ENCODED=$(urlencode "${PART_BASENAME}")
                    RAW_LINK="${RAW_BASE}/${FOLDER_ENCODED}/${PART_ENCODED}"
                    LINK_NUM=$((LINK_NUM + 1))
                    DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | [Download](${RAW_LINK}) |"$'\n'
                    ALL_LINKS="${ALL_LINKS}${RAW_LINK}"$'\n'
                    PART_SIZE=$(stat -c%s "$part_file" 2>/dev/null || echo 0)
                    TOTAL_ARCHIVE_SIZE=$((TOTAL_ARCHIVE_SIZE + PART_SIZE))
                  done
                  
                  ARCHIVE_SIZE_MB=$(echo "scale=2; $TOTAL_ARCHIVE_SIZE / 1024 / 1024" | bc)
                  
                  {
                    echo "# ${ARCHIVE_NAME} Archive"
                    echo ""
                    echo "---"
                    echo ""
                    echo "## General Information"
                    echo ""
                    echo "| Property | Value |"
                    echo "|----------|-------|"
                    echo "| **Name** | \`${ARCHIVE_NAME}\` |"
                    echo "| **Total Size** | ${ARCHIVE_SIZE_MB} MB |"
                    echo "| **Parts** | ${PARTS_COUNT} |"
                    if [ "$PARTS_COUNT" -gt 1 ]; then
                      echo "| **Archive Part Size** | ${PART_SIZE_MB} MB |"
                    fi
                    echo "| **Compression Method** | 7-Zip LZMA2 (Level ${MX_LEVEL}) |"
                    echo "| **Date and Time** | $(date '+%Y-%m-%d %H:%M:%S UTC') |"
                    echo "| **Status** | <span style=\"color:green\">**Downloaded**</span> |"
                    echo ""
                    echo "---"
                    echo ""
                    echo "## Files Inside Archive"
                    echo ""
                    echo "| Count | Name | Size |"
                    echo "|-------|------|------|"
                    for file_in_archive in "$TEMP_ARCHIVE_DIR"/*; do
                      if [ -f "$file_in_archive" ]; then
                        FNAME=$(basename "$file_in_archive")
                        FSIZE=$(stat -c%s "$file_in_archive" 2>/dev/null || echo 0)
                        FSIZE_MB=$(echo "scale=2; $FSIZE / 1024 / 1024" | bc)
                        echo "| 1 | \`${FNAME}\` | ${FSIZE_MB} MB |"
                      fi
                    done
                    echo ""
                    echo "---"
                    echo ""
                    echo "## Download Links"
                    echo ""
                    echo "| # | File | Link |"
                    echo "|---|------|------|"
                    printf '%s' "${DOWNLOAD_LINKS_MD}"
                    echo ""
                    echo "---"
                    echo ""
                    echo "## All Links (for Download Managers)"
                    echo ""
                    echo '```'
                    printf '%s' "${ALL_LINKS}"
                    echo '```'
                    echo ""
                    echo "---"
                    echo ""
                    echo "## How to Extract"
                    echo ""
                    echo "1. Download all parts"
                    echo "2. Open \`${ARCHIVE_NAME}.7z.001\` with 7-Zip"
                    if [ -n "$ZIP_PASSWORD" ]; then
                      echo "3. Enter password: \`${ZIP_PASSWORD}\`"
                    fi
                    echo ""
                    echo "*This tool is provided as is*"
                  } > "$BACKUP_DIR/$FOLDER_NAME/README.md"
                fi
              fi
            fi
            rm -rf tmp_downloads
          else
            # Normal mode - individual files
            for FILE in tmp_downloads/*; do
              [ -f "$FILE" ] || continue
              if [ ! -s "$FILE" ]; then continue; fi
              
              BASENAME=$(basename "$FILE")
              BASENAME_NO_EXT="${BASENAME%.*}"
              FOLDER_NAME=$(get_unique_folder "$BACKUP_DIR" "$BASENAME_NO_EXT")
              mkdir -p "$BACKUP_DIR/$FOLDER_NAME"
              
              cp "$FILE" "$BACKUP_DIR/$FOLDER_NAME/$BASENAME"
              
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
              
              FOLDER_ENCODED=$(urlencode "${FOLDER_NAME}")
              RAW_BASE="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads"
              FILE_ENCODED=$(urlencode "${BASENAME}")
              RAW_LINK="${RAW_BASE}/${FOLDER_ENCODED}/${FILE_ENCODED}"
              
              {
                echo "# ${BASENAME}"
                echo ""
                echo "---"
                echo ""
                echo "## General Information"
                echo ""
                echo "| Property | Value |"
                echo "|----------|-------|"
                echo "| **Name** | \`${BASENAME}\` |"
                echo "| **Total Size** | ${SIZE_MB} MB |"
                echo "| **Date and Time** | $(date '+%Y-%m-%d %H:%M:%S UTC') |"
                echo "| **Status** | <span style=\"color:green\">**Downloaded**</span> |"
                echo ""
                echo "---"
                echo ""
                echo "## Download Link"
                echo ""
                echo "| File | Link |"
                echo "|------|------|"
                echo "| \`${BASENAME}\` | [Download](${RAW_LINK}) |"
                echo ""
                echo "---"
                echo ""
                echo "*This tool is provided as is*"
              } > "$BACKUP_DIR/$FOLDER_NAME/README.md"
            done
            rm -rf tmp_downloads
          fi
          
          echo "Download processing completed."
      - name: Update README.md with download links
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          
          mkdir -p downloads
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            cp -r "$BACKUP_DIR"/* downloads/
          fi
          
          # Generate rich table for root downloads/README.md
          {
            echo "# Downloaded Files"
            echo ""
            echo "| Name | Size | Method | Files | Date and Time | Status |"
            echo "|------|------|--------|-------|---------------|--------|"
            
            for folder in downloads/*/ ; do
              [ -d "$folder" ] || continue
              FOLDER_NAME=$(basename "$folder")
              if [ -f "$folder/README.md" ]; then
                # Extract info from README (simplified parsing)
                SIZE_INFO=$(grep -oE '\|[^|]*Size[^|]*\|[^|]*' "$folder/README.md" | head -1 | cut -d'|' -f3 || echo "N/A")
                METHOD="Normal"
                if ls "$folder"/*.7z.* 1> /dev/null 2>&1; then
                  METHOD="Zip"
                fi
                FILE_COUNT=$(ls -1 "$folder" | wc -l)
                DATE_INFO=$(date '+%Y-%m-%d %H:%M')
                echo "| ${FOLDER_NAME} | ${SIZE_INFO} | ${METHOD} | ${FILE_COUNT} | ${DATE_INFO} | <span style=\"color:green\">Downloaded</span> |"
              fi
            done
            echo ""
            echo "---"
            echo ""
            echo "*This tool is provided as is*"
          } > "downloads/README.md"
          
          # Update main README
          if [ ! -f "README.md" ]; then
            echo "# GitHub File Downloader" > README.md
          fi
          
          echo "README files updated with enhanced metadata."
      - name: Incremental Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"
          
          git add -f downloads/
          git add -f README.md
          
          if ! git diff --cached --quiet; then
            git commit -m "[GitHub Action] Downloaded files - Enhanced metadata [skip ci]"
            timeout 300 git push origin HEAD:"$BRANCH" || echo "Push completed with warnings"
          else
            echo "No changes to commit"
          fi
          
          echo "All operations completed successfully."
