---
name: ⬇️  01- Download URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 Download URLs (separate by space)'
        required: false
        type: string
      mode:
        description: '📦 Download mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      part_size_mb:
        description: '📦 Size of each split part in MB (10–90)'
        required: false
        default: '45'
        type: string
      password:
        description: '🔒 Password for archive (optional)'
        required: false
        default: ''
        type: string
      compression_preset:
        description: '📊 Size Preset (Compression Level, Default: Auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - best
          - great
          - good
          - fast
          - fastest

env:
  CODES_URL: ""

jobs:
  save-file:
    runs-on: ubuntu-latest
    timeout-minutes: 360                 # 6 hours
    permissions:
      contents: write
    steps:
      # --- Step 1: Check URL Input ---
      - name: Check URL provided
        id: check_urls
        run: |
          if [ -z "${{ github.event.inputs.urls }}" ]; then
            echo ""
            echo "❌ No download URL provided!"
            echo ""
            echo "📌 How to use:"
            echo "   1️⃣ Re-run this workflow"
            echo "   2️⃣ Enter the file URL in the 'Download URLs' field"
            echo "   3️⃣ For multiple files, separate URLs with spaces"
            echo ""
            exit 1
          fi
          echo "✅ URL received"

      # --- Step 2: Checkout and Setup ---
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # --- Step 3: Configuration & Dependencies ---
      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Git configured for large file handling"

      - name: Install aria2, p7zip-full, curl, bc
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full curl bc

      # --- Step 4: Core Download Logic with Timestamp & Duration Tracking ---
      - name: Downloader - Start
        run: |
          echo "🏷️  GitHub File Downloader"
          echo ""

      - name: Download and Archive Files
        run: |
          # Capture start time for duration calculation
          START_EPOCH=$(date +%s)
          START_TIME=$(date +%Y%m%d_%H%M%S)
          START_HUMAN=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "START_EPOCH=$START_EPOCH" >> $GITHUB_ENV
          echo "START_TIME=$START_TIME" >> $GITHUB_ENV
          echo "START_HUMAN=$START_HUMAN" >> $GITHUB_ENV

          MODE="${{ github.event.inputs.mode }}"
          URLS="${{ github.event.inputs.urls }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"
          PART_SIZE_MB_RAW="${{ github.event.inputs.part_size_mb }}"
          COMPRESSION_PRESET="${{ github.event.inputs.compression_preset }}"

          # Validate and clamp part size between 10 and 90 MB
          if [[ -z "$PART_SIZE_MB_RAW" ]]; then
            PART_SIZE_MB=45
          else
            PART_SIZE_MB=$(( PART_SIZE_MB_RAW ))
            if [ $PART_SIZE_MB -lt 10 ]; then
              PART_SIZE_MB=10
            elif [ $PART_SIZE_MB -gt 90 ]; then
              PART_SIZE_MB=90
            fi
          fi
          SPLIT_THRESHOLD_BYTES=$(( PART_SIZE_MB * 1024 * 1024 ))

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt

          # Create run‑specific top folder
          if [ "$MODE" = "zip" ]; then
            RUN_FOLDER_NAME="archive_${START_TIME}"
          else
            RUN_FOLDER_NAME="download_${START_TIME}"
          fi
          RUN_FOLDER_PATH="$BACKUP_DIR/$RUN_FOLDER_NAME"
          mkdir -p "$RUN_FOLDER_PATH"
          echo "$RUN_FOLDER_NAME" > /tmp/run_folder_name.txt
          echo "Run folder: $RUN_FOLDER_PATH"

          echo "Downloading with mode: $MODE"
          echo "Part size: ${PART_SIZE_MB} MB (clamped to 10–90 range)"
          echo "Compression preset: ${COMPRESSION_PRESET}"
          if [ -n "$ZIP_PASSWORD" ]; then
            echo "Password protection: ENABLED"
          else
            echo "Password protection: DISABLED"
          fi

          CPU_CORES=$(nproc)
          echo "CPU cores available: $CPU_CORES"
          MAX_ARCHIVE_TIME_SEC=19800   # 5.5 hours

          mkdir -p downloads tmp_downloads

          # ---------- Keep‑alive runner ----------
          keepalive_exec() {
            local desc="$1"; shift
            echo "$desc starting..."
            "$@" > /dev/null 2>&1 &
            local pid=$!
            while kill -0 $pid 2>/dev/null; do
              echo "$desc still running ($(date))"
              sleep 30
            done
            wait $pid
            local ret=$?
            echo "$desc finished with exit code $ret"
            return $ret
          }

          RANDOM_WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river" "ocean" "mountain")

          get_random_word() {
            echo "${RANDOM_WORDS[$RANDOM % ${#RANDOM_WORDS[@]}]}_$RANDOM"
          }

          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ]; then
              echo "$NAME"
              return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          create_error_file() {
            local FILENAME="$1"
            local ERROR_MSG="$2"
            local URL="$3"
            local BASENAME_NO_EXT="${FILENAME%.*}"
            local FOLDER_NAME=$(get_unique_folder "$RUN_FOLDER_PATH" "$BASENAME_NO_EXT")
            mkdir -p "$RUN_FOLDER_PATH/$FOLDER_NAME"
            {
              echo "# ${FILENAME} - Download Failed"
              echo ""
              echo "---"
              echo ""
              echo "## Download Information"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **File** | \`${FILENAME}\` |"
              echo "| **URL** | ${URL} |"
              echo "| **Date** | $(date '+%Y-%m-%d %H:%M:%S UTC') |"
              echo "| **Status** | **FAILED** |"
              echo ""
              echo "---"
              echo ""
              echo "## Error Details"
              echo ""
              echo "\`\`\`"
              echo "$ERROR_MSG"
              echo "\`\`\`"
              echo ""
              echo "---"
              echo ""
              echo "## Possible Solutions"
              echo ""
              echo "- Check if the URL is correct and accessible"
              echo "- The file may have been removed or moved"
              echo "- The server may require authentication"
              echo "- Some servers block automated downloads (403 Forbidden)"
              echo "- Try again later if it is a temporary server issue"
              echo ""
              echo "---"
              echo ""
              echo "*This tool is provided as is*"
            } > "$RUN_FOLDER_PATH/$FOLDER_NAME/README.md"
            echo "Error file created: $RUN_FOLDER_PATH/$FOLDER_NAME/README.md"
          }

          download_with_retry() {
            local URL="$1"
            local FILENAME="$2"
            local MAX_RETRIES=3
            local RETRY_DELAY=5
            local SUCCESS=false
            local ERROR_LOG=""

            rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"

            for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
              echo "Attempt $attempt of $MAX_RETRIES for $FILENAME"

              rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"

              ERROR_LOG=$(aria2c \
                --split=2 \
                --max-connection-per-server=2 \
                --min-split-size=20M \
                --max-tries=3 \
                --retry-wait=5 \
                --timeout=60 \
                --connect-timeout=30 \
                --follow-torrent=false \
                --check-certificate=false \
                --allow-overwrite=true \
                --auto-file-renaming=false \
                --dir="tmp_downloads" \
                --out="$FILENAME" \
                "$URL" 2>&1)

              if [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
                local FILE_SIZE=$(stat -c%s "tmp_downloads/$FILENAME" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 0 ]; then
                  SUCCESS=true
                  echo "aria2c download successful: $FILENAME (${FILE_SIZE} bytes)"
                  break
                fi
              fi

              rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
              echo "aria2c failed or file empty, trying curl fallback..."

              ERROR_LOG=$(curl -L -f -# \
                --retry 3 \
                --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 3600 \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                -o "tmp_downloads/$FILENAME" \
                "$URL" 2>&1)

              if [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
                local FILE_SIZE=$(stat -c%s "tmp_downloads/$FILENAME" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -gt 0 ]; then
                  SUCCESS=true
                  echo "curl download successful: $FILENAME (${FILE_SIZE} bytes)"
                  break
                fi
              fi

              rm -f "tmp_downloads/$FILENAME"
              echo "Attempt $attempt failed. Waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            done

            if [ "$SUCCESS" = true ] && [ -f "tmp_downloads/$FILENAME" ] && [ -s "tmp_downloads/$FILENAME" ]; then
              local FINAL_SIZE=$(stat -c%s "tmp_downloads/$FILENAME" 2>/dev/null || echo "0")
              if [ "$FINAL_SIZE" -gt 0 ]; then
                echo "Successfully downloaded: $FILENAME ($FINAL_SIZE bytes)"
                return 0
              fi
            fi

            rm -f "tmp_downloads/$FILENAME" "tmp_downloads/$FILENAME.aria2"
            create_error_file "$FILENAME" "Download failed after $MAX_RETRIES attempts. Last error: $ERROR_LOG" "$URL"
            return 1
          }

          # Download all URLs
          for URL in $URLS; do
            FILENAME=$(basename "$URL" | sed 's/%20/ /g' | sed 's/%2F/-/g' | sed 's/[?#].*//')
            FILENAME=$(echo "$FILENAME" | sed 's/[<>:"|?*]/_/g')
            echo "Downloading $URL -> $FILENAME"
            download_with_retry "$URL" "$FILENAME" || echo "Failed to download: $FILENAME"
          done

          # ---------- Compression level selector (with Auto prediction) ----------
          determine_compression_level() {
            local TOTAL_SIZE="$1"
            local PRESET="$2"
            local CORES="$3"

            case "$PRESET" in
              best)     echo 9; return ;;
              great)    echo 7; return ;;
              good)     echo 5; return ;;
              fast)     echo 3; return ;;
              fastest)  echo 1; return ;;
            esac

            # Auto: estimate time for each level and pick the highest safe one
            declare -A SPEED_MAP
            SPEED_MAP[9]=0.2
            SPEED_MAP[7]=0.5
            SPEED_MAP[5]=1.0
            SPEED_MAP[3]=2.0
            SPEED_MAP[1]=5.0

            local SIZE_MB=$(( TOTAL_SIZE / 1048576 ))
            echo "Auto mode: estimating optimal compression level for ${SIZE_MB}MB on ${CORES} cores (max archive time ${MAX_ARCHIVE_TIME_SEC}s)..."

            local CHOSEN_LEVEL=1
            for level in 9 7 5 3 1; do
              local SPEED=${SPEED_MAP[$level]}
              local EST_TIME=$(echo "scale=0; $SIZE_MB / ($SPEED * $CORES)" | bc)
              echo "  -mx=${level}: estimated ${EST_TIME}s"
              if [ "$EST_TIME" -le "$MAX_ARCHIVE_TIME_SEC" ]; then
                CHOSEN_LEVEL=$level
                break
              fi
            done

            echo "Auto selected compression level -mx=${CHOSEN_LEVEL}"
            echo "$CHOSEN_LEVEL"
          }

          # ---------- Helper to list files with sizes ----------
          list_files_with_sizes() {
            local DIR="$1"
            for f in "$DIR"/*; do
              if [ -f "$f" ]; then
                local name=$(basename "$f")
                local size=$(stat -c%s "$f" 2>/dev/null || echo 0)
                local size_mb=$(echo "scale=2; $size/1048576" | bc)
                echo "- \`$name\` (${size_mb} MB)"
              fi
            done
          }

          # ---------- Archive creation ----------
          create_high_ratio_archive() {
            local SOURCE_PATH="$1"
            local OUTPUT_BASE="$2"
            local SPLIT_SIZE_MB="$3"
            local IS_DIRECTORY="$4"
            local PASSWORD="$5"
            local MX_LEVEL="$6"

            local -a CMD_ARGS=(7z a -t7z -mx=${MX_LEVEL})
            if [ -n "$PASSWORD" ]; then
              CMD_ARGS+=(-p"$PASSWORD")
            fi
            if [ -n "$SPLIT_SIZE_MB" ] && [ "$SPLIT_SIZE_MB" -gt 0 ]; then
              CMD_ARGS+=(-v${SPLIT_SIZE_MB}m)
            fi
            if [ "$IS_DIRECTORY" = "yes" ]; then
              CMD_ARGS+=("${OUTPUT_BASE}.7z" "$SOURCE_PATH/")
            else
              CMD_ARGS+=("${OUTPUT_BASE}.7z" "$SOURCE_PATH")
            fi

            echo "7z command: ${CMD_ARGS[*]}"
            keepalive_exec "7z archive" "${CMD_ARGS[@]}"
          }

          # ---------- Process according to mode ----------
          if [ "$MODE" = "zip" ]; then
            # Combined archive of all downloaded files
            if [ -n "$(ls -A tmp_downloads 2>/dev/null)" ]; then
              # Count files and collect info
              FILE_COUNT=0
              FILE_LIST_ITEMS=""
              TOTAL_SIZE=0
              for f in tmp_downloads/*; do
                if [ -f "$f" ] && [ -s "$f" ]; then
                  FILE_COUNT=$((FILE_COUNT + 1))
                  fname=$(basename "$f")
                  fsize=$(stat -c%s "$f" 2>/dev/null || echo 0)
                  TOTAL_SIZE=$((TOTAL_SIZE + fsize))
                  fsize_mb=$(echo "scale=2; $fsize/1048576" | bc)
                  FILE_LIST_ITEMS="${FILE_LIST_ITEMS}- \`$fname\` (${fsize_mb} MB)\n"
                fi
              done

              # Determine archive name: for single file, use filename (truncated)
              if [ $FILE_COUNT -eq 1 ]; then
                SINGLE_FILE=$(basename $(ls tmp_downloads/* | head -1))
                BASENAME_NO_EXT="${SINGLE_FILE%.*}"
                # Truncate to max 50 chars
                if [ ${#BASENAME_NO_EXT} -gt 50 ]; then
                  BASENAME_NO_EXT="${BASENAME_NO_EXT:0:47}..."
                fi
                ARCHIVE_NAME="$BASENAME_NO_EXT"
              else
                ARCHIVE_NAME="archive_${START_TIME}"
              fi

              FOLDER_NAME=$(get_unique_folder "$RUN_FOLDER_PATH" "$ARCHIVE_NAME")
              mkdir -p "$RUN_FOLDER_PATH/$FOLDER_NAME"
              echo "Creating 7z multi‑volume archive in folder: $RUN_FOLDER_PATH/$FOLDER_NAME"

              TEMP_ARCHIVE_DIR="/tmp/7z_temp_$$"
              mkdir -p "$TEMP_ARCHIVE_DIR"
              VALID_FILES=0
              for f in tmp_downloads/*; do
                if [ -f "$f" ] && [ -s "$f" ]; then
                  cp "$f" "$TEMP_ARCHIVE_DIR/"
                  VALID_FILES=$((VALID_FILES + 1))
                else
                  echo "Skipping empty or invalid file: $f"
                fi
              done

              if [ $VALID_FILES -gt 0 ]; then
                MX_LEVEL=$(determine_compression_level "$TOTAL_SIZE" "$COMPRESSION_PRESET" "$CPU_CORES")
                echo "Using compression level -mx=${MX_LEVEL} for combined archive (${TOTAL_SIZE} bytes total)"
                ARCHIVE_BASE="$RUN_FOLDER_PATH/$FOLDER_NAME/$ARCHIVE_NAME"
                create_high_ratio_archive "$TEMP_ARCHIVE_DIR" "$ARCHIVE_BASE" "$PART_SIZE_MB" "yes" "$ZIP_PASSWORD" "$MX_LEVEL"
                rm -rf "$TEMP_ARCHIVE_DIR"

                PARTS_COUNT=$(ls "$RUN_FOLDER_PATH/$FOLDER_NAME/"*.7z.* 2>/dev/null | wc -l)
                if [ "$PARTS_COUNT" -eq 0 ]; then
                  echo "ERROR: No archive parts were created!"
                  rm -f "$RUN_FOLDER_PATH/$FOLDER_NAME/$ARCHIVE_NAME".7z.*
                else
                  FOLDER_ENCODED=$(urlencode "${FOLDER_NAME}")
                  RUN_FOLDER_ENCODED=$(urlencode "${RUN_FOLDER_NAME}")
                  RAW_BASE="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${RUN_FOLDER_ENCODED}"
                  DOWNLOAD_LINKS_MD=""
                  ALL_LINKS=""
                  LINK_NUM=0
                  TOTAL_ARCHIVE_SIZE=0
                  for part_file in $(ls "$RUN_FOLDER_PATH/$FOLDER_NAME/"*.7z.* 2>/dev/null | sort); do
                    [ -f "$part_file" ] || continue
                    PART_BASENAME=$(basename "$part_file")
                    PART_ENCODED=$(urlencode "${PART_BASENAME}")
                    RAW_LINK="${RAW_BASE}/${FOLDER_ENCODED}/${PART_ENCODED}"
                    LINK_NUM=$((LINK_NUM + 1))
                    DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | [Download](${RAW_LINK}) |"$'\n'
                    ALL_LINKS="${ALL_LINKS}${RAW_LINK}"$'\n'
                    PART_SIZE=$(stat -c%s "$part_file" 2>/dev/null || echo 0)
                    TOTAL_ARCHIVE_SIZE=$((TOTAL_ARCHIVE_SIZE + PART_SIZE))
                  done
                  ARCHIVE_SIZE_MB=$(echo "scale=2; $TOTAL_ARCHIVE_SIZE / 1024 / 1024" | bc)

                  # Build files included list (first 5, with count)
                  INCLUDED_FILES_MD=""
                  if [ -n "$FILE_LIST_ITEMS" ]; then
                    INCLUDED_FILES_MD="$FILE_LIST_ITEMS"
                  fi

                  {
                    echo "# ${ARCHIVE_NAME} Archive"
                    echo ""
                    echo "---"
                    echo ""
                    echo "## Download Information"
                    echo ""
                    echo "| Property | Value |"
                    echo "|----------|-------|"
                    echo "| **Run Date** | ${START_HUMAN} |"
                    echo "| **Archive Name** | \`${ARCHIVE_NAME}.7z\` |"
                    echo "| **Total Size** | ${ARCHIVE_SIZE_MB} MB (${LINK_NUM} parts) |"
                    echo "| **Compression** | 7‑Zip LZMA2 (level ${MX_LEVEL}) |"
                    if [ -n "$ZIP_PASSWORD" ]; then
                      echo "| **Password** | \`${ZIP_PASSWORD}\` |"
                    fi
                    echo "| **Status** | **Complete (100%)** |"
                    echo ""
                    echo "---"
                    echo ""
                    echo "## Files Included"
                    echo ""
                    printf '%b' "$INCLUDED_FILES_MD"
                    echo ""
                    echo "---"
                    echo ""
                    echo "## Download Links"
                    echo ""
                    echo "| # | File | Link |"
                    echo "|---|------|------|"
                    printf '%s' "${DOWNLOAD_LINKS_MD}"
                    echo ""
                    echo "---"
                    echo ""
                    echo "## All Links (for Download Managers)"
                    echo ""
                    echo '```'
                    printf '%s' "${ALL_LINKS}"
                    echo '```'
                    echo ""
                    echo "---"
                    echo ""
                    echo "## How to Extract"
                    echo ""
                    echo "1. **Download all parts** (\`.7z.001\`, \`.7z.002\`, ...)"
                    echo "2. **Open** \`${ARCHIVE_NAME}.7z.001\` with **7‑Zip**, **WinRAR**, or **Ark**"
                    if [ -n "$ZIP_PASSWORD" ]; then
                      echo "3. **Enter the password** when prompted: \`${ZIP_PASSWORD}\`"
                      echo "4. **Extract** — all parts combine automatically"
                    else
                      echo "3. **Extract** — all parts combine automatically"
                    fi
                    echo ""
                    echo "---"
                    echo ""
                    echo "*This tool is provided as is*"
                  } > "$RUN_FOLDER_PATH/$FOLDER_NAME/README.md"
                fi
              else
                echo "No valid files to archive!"
              fi
            fi
            rm -rf tmp_downloads

          else
            # Normal mode: each file gets its own archive, all inside the timestamp folder
            for FILE in tmp_downloads/*; do
              [ -f "$FILE" ] || continue

              if [ ! -s "$FILE" ]; then
                echo "WARNING: Skipping empty file: $FILE"
                rm -f "$FILE"
                continue
              fi

              SIZE=$(stat -c%s "$FILE")
              if [ "$SIZE" -le 0 ]; then
                echo "WARNING: File has zero or invalid size: $FILE"
                rm -f "$FILE"
                continue
              fi

              BASENAME=$(basename "$FILE")
              BASENAME_NO_EXT="${BASENAME%.*}"
              EXT="${BASENAME##*.}"

              FOLDER_NAME=$(get_unique_folder "$RUN_FOLDER_PATH" "$BASENAME_NO_EXT")
              mkdir -p "$RUN_FOLDER_PATH/$FOLDER_NAME"
              FOLDER_ENCODED=$(urlencode "${FOLDER_NAME}")
              RUN_FOLDER_ENCODED=$(urlencode "${RUN_FOLDER_NAME}")

              MX_LEVEL=$(determine_compression_level "$SIZE" "$COMPRESSION_PRESET" "$CPU_CORES")
              echo "Using compression level -mx=${MX_LEVEL} for ${BASENAME} (${SIZE} bytes)"

              if [ "$SIZE" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
                echo "$BASENAME is $(( SIZE / 1024 / 1024 ))MB - creating 7z multi‑volume archive (${PART_SIZE_MB}MB parts)"

                ARCHIVE_BASE="$RUN_FOLDER_PATH/$FOLDER_NAME/$FOLDER_NAME"
                create_high_ratio_archive "$FILE" "$ARCHIVE_BASE" "$PART_SIZE_MB" "no" "$ZIP_PASSWORD" "$MX_LEVEL"

                PARTS_COUNT=$(ls "$RUN_FOLDER_PATH/$FOLDER_NAME/"*.7z.* 2>/dev/null | wc -l)
                echo "Parts created in folder $RUN_FOLDER_PATH/$FOLDER_NAME: $PARTS_COUNT files"

                if [ "$PARTS_COUNT" -eq 0 ]; then
                  echo "ERROR: No archive parts were created for $BASENAME"
                  continue
                fi

                RAW_BASE="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${RUN_FOLDER_ENCODED}"
                TOTAL_SIZE=0
                DOWNLOAD_LINKS_MD=""
                ALL_LINKS=""
                LINK_NUM=0
                for part_file in $(ls "$RUN_FOLDER_PATH/$FOLDER_NAME/"*.7z.* 2>/dev/null | sort); do
                  if [ -f "$part_file" ]; then
                    PART_BASENAME=$(basename "$part_file")
                    PART_ENCODED=$(urlencode "${PART_BASENAME}")
                    RAW_LINK="${RAW_BASE}/${FOLDER_ENCODED}/${PART_ENCODED}"
                    LINK_NUM=$((LINK_NUM + 1))
                    DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | [Download](${RAW_LINK}) |"$'\n'
                    ALL_LINKS="${ALL_LINKS}${RAW_LINK}"$'\n'
                    PART_SIZE_BYTES=$(stat -c%s "$part_file" 2>/dev/null || echo 0)
                    TOTAL_SIZE=$((TOTAL_SIZE + PART_SIZE_BYTES))
                  fi
                done
                TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)

                # For normal mode, only one file is included
                FILE_SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
                README_FILE="$RUN_FOLDER_PATH/$FOLDER_NAME/README.md"
                {
                  printf '%s\n' "# ${BASENAME_NO_EXT}"
                  printf '%s\n' ""
                  printf '%s\n' "---"
                  printf '%s\n' ""
                  printf '%s\n' "## Download Information"
                  printf '%s\n' ""
                  printf '%s\n' "| Property | Value |"
                  printf '%s\n' "|----------|-------|"
                  printf '%s\n' "| **Run Date** | ${START_HUMAN} |"
                  printf '%s\n' "| **Original File** | \`${BASENAME}\` |"
                  printf '%s\n' "| **Total Size** | **${PARTS_COUNT} parts** - **${TOTAL_SIZE_MB} MB** |"
                  printf '%s\n' "| **Compression** | 7‑Zip LZMA2 (level ${MX_LEVEL}) |"
                  if [ -n "$ZIP_PASSWORD" ]; then
                    printf '%s\n' "| **Password** | \`${ZIP_PASSWORD}\` |"
                  fi
                  printf '%s\n' "| **Status** | **Complete (100%)** |"
                  echo ""
                  echo "---"
                  echo ""
                  echo "## Files Included"
                  echo ""
                  echo "- \`${BASENAME}\` (${FILE_SIZE_MB} MB)"
                  echo ""
                  echo "---"
                  echo ""
                  echo "## Download Links"
                  echo ""
                  echo "| # | File | Link |"
                  echo "|---|------|------|"
                  printf '%s' "${DOWNLOAD_LINKS_MD}"
                  echo ""
                  echo "---"
                  echo ""
                  echo "## All Links (for Download Managers)"
                  echo ""
                  echo '```'
                  printf '%s' "${ALL_LINKS}"
                  echo '```'
                  echo ""
                  echo "---"
                  echo ""
                  echo "## How to Extract"
                  echo ""
                  echo "1. **Download all parts** (\`.7z.001\`, \`.7z.002\`, ...)"
                  echo "2. **Open** \`${FOLDER_NAME}.7z.001\` with **7‑Zip**, **WinRAR**, or **Ark**"
                  if [ -n "$ZIP_PASSWORD" ]; then
                    echo "3. **Enter the password** when prompted: \`${ZIP_PASSWORD}\`"
                    echo "4. **Extract** — all parts combine automatically"
                  else
                    echo "3. **Extract** — all parts combine automatically"
                  fi
                  echo ""
                  echo "---"
                  echo ""
                  echo "*This tool is provided as is*"
                } > "$README_FILE"

                echo "Created split 7z archive and README.md"

              else
                echo "$BASENAME - creating single 7z archive in folder: $RUN_FOLDER_PATH/$FOLDER_NAME"

                ARCHIVE_BASE="$RUN_FOLDER_PATH/$FOLDER_NAME/$FOLDER_NAME"
                create_high_ratio_archive "$FILE" "$ARCHIVE_BASE" "" "no" "$ZIP_PASSWORD" "$MX_LEVEL"

                if [ ! -s "${ARCHIVE_BASE}.7z" ]; then
                  echo "ERROR: Failed to create archive for $BASENAME"
                  rm -f "${ARCHIVE_BASE}.7z"
                  continue
                fi

                RAW_BASE="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${RUN_FOLDER_ENCODED}"
                SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
                FILE_ENCODED=$(urlencode "${FOLDER_NAME}.7z")
                RAW_LINK="${RAW_BASE}/${FOLDER_ENCODED}/${FILE_ENCODED}"

                README_FILE="$RUN_FOLDER_PATH/$FOLDER_NAME/README.md"
                {
                  printf '%s\n' "# ${BASENAME_NO_EXT}"
                  printf '%s\n' ""
                  printf '%s\n' "---"
                  printf '%s\n' ""
                  printf '%s\n' "## Download Information"
                  printf '%s\n' ""
                  printf '%s\n' "| Property | Value |"
                  printf '%s\n' "|----------|-------|"
                  printf '%s\n' "| **Run Date** | ${START_HUMAN} |"
                  printf '%s\n' "| **Original File** | \`${BASENAME}\` |"
                  printf '%s\n' "| **Size** | ${SIZE_MB} MB |"
                  printf '%s\n' "| **Compression** | 7‑Zip LZMA2 (level ${MX_LEVEL}) |"
                  if [ -n "$ZIP_PASSWORD" ]; then
                    printf '%s\n' "| **Password** | \`${ZIP_PASSWORD}\` |"
                  fi
                  printf '%s\n' "| **Status** | **Complete (100%)** |"
                  echo ""
                  echo "---"
                  echo ""
                  echo "## Files Included"
                  echo ""
                  echo "- \`${BASENAME}\` (${SIZE_MB} MB)"
                  echo ""
                  echo "---"
                  echo ""
                  echo "## Download Link"
                  echo ""
                  echo "| File | Link |"
                  echo "|------|------|"
                  printf '%s\n' "| \`${FOLDER_NAME}.7z\` | [Download](${RAW_LINK}) |"
                  echo ""
                  echo "---"
                  echo ""
                  echo "## All Links (for Download Managers)"
                  echo ""
                  echo '```'
                  printf '%s\n' "${RAW_LINK}"
                  echo '```'
                  echo ""
                  echo "---"
                  echo ""
                  echo "## How to Extract"
                  echo ""
                  echo "1. **Open** \`${FOLDER_NAME}.7z\` with **7‑Zip**, **WinRAR**, or **Ark**"
                  if [ -n "$ZIP_PASSWORD" ]; then
                    echo "2. **Enter the password** when prompted: \`${ZIP_PASSWORD}\`"
                    echo "3. **Extract** the file"
                  else
                    echo "2. **Extract** the file"
                  fi
                  echo ""
                  echo "---"
                  echo ""
                  echo "*This tool is provided as is*"
                } > "$README_FILE"

                echo "Created single 7z archive and README.md"
              fi
            done
            rm -rf tmp_downloads
          fi

          # Capture end time and compute duration
          END_EPOCH=$(date +%s)
          DURATION_SEC=$((END_EPOCH - START_EPOCH))
          DURATION_HUMAN=$(printf '%02dh:%02dm:%02ds' $((DURATION_SEC/3600)) $(((DURATION_SEC%3600)/60)) $((DURATION_SEC%60)))
          echo "DURATION_HUMAN=$DURATION_HUMAN" >> $GITHUB_ENV
          echo "Job duration: $DURATION_HUMAN"

          # Append duration to every generated README.md inside RUN_FOLDER_PATH
          find "$RUN_FOLDER_PATH" -name "README.md" -type f | while read -r readme; do
            sed -i "/^| \\*\\*Status\\*\\* /a | **Job Duration** | ${DURATION_HUMAN} |" "$readme"
          done

          echo ""
          echo "===== Backup folder contents ====="
          find "$BACKUP_DIR" -type f | head -50

      # --- Step 5: Update README.md with detailed download links ---
      - name: Update README.md with download links
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          RUN_FOLDER_NAME=$(cat /tmp/run_folder_name.txt)
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"

          mkdir -p downloads
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            cp -r "$BACKUP_DIR"/* downloads/
          fi

          # Function to extract info from a subfolder's README.md
          extract_readme_info() {
            local readme="$1"
            local folder_name="$2"
            local run_folder="$3"

            # Extract total size
            total_size=$(grep -E "^\| \*\*Total Size\*\*" "$readme" | sed -E 's/.*\|\s*\*\*([^*]+)\*\*\s*\|\s*(.*?)\s*\|/\2/' | head -1)
            # Extract parts count (if any)
            parts=$(echo "$total_size" | grep -oE '[0-9]+ parts' | grep -oE '[0-9]+' | head -1)
            # For single file, parts might be empty
            if [ -z "$parts" ]; then
              parts="1"
            fi
            # Extract list of files included
            files_section=$(awk '/^## Files Included/,/^## /' "$readme" | grep '^- `' | head -5)
            files_list=""
            count=0
            while IFS= read -r line; do
              count=$((count+1))
              files_list="${files_list}  ${line}\n"
            done <<< "$files_section"
            total_files=$(grep -c '^- `' "$readme")
            if [ $total_files -gt 5 ]; then
              files_list="${files_list}  - *and $((total_files-5)) more file(s)*\n"
            fi
            # Extract run date
            run_date=$(grep -E "^\| \*\*Run Date\*\*" "$readme" | sed -E 's/.*\|\s*\*\*([^*]+)\*\*\s*\|\s*(.*?)\s*\|/\2/' | head -1)
            if [ -z "$run_date" ]; then
              run_date="${{ env.START_HUMAN }}"
            fi

            echo "total_size='$total_size'"
            echo "parts='$parts'"
            echo "files_list='$files_list'"
            echo "run_date='$run_date'"
          }

          # Build the top-level downloads/README.md
          {
            echo "# 📦 Downloaded files"
            echo ""
            echo "This folder contains archives created by the GitHub File Downloader."
            echo ""
            echo "## Run folders"
            echo ""
          } > downloads/README.md

          # Iterate over each run folder (download_* or archive_*)
          for run_folder in downloads/*/; do
            [ -d "$run_folder" ] || continue
            run_name=$(basename "$run_folder")
            # For each run folder, iterate over its subfolders (each containing an archive)
            echo "### ${run_name}" >> downloads/README.md
            echo "" >> downloads/README.md
            echo "| Archive | Total Size | Parts | Files Included | Run Date |" >> downloads/README.md
            echo "|---------|------------|-------|----------------|----------|" >> downloads/README.md

            for subfolder in "$run_folder"*/; do
              [ -d "$subfolder" ] || continue
              readme_file="${subfolder}README.md"
              if [ -f "$readme_file" ]; then
                folder_name=$(basename "$subfolder")
                eval "$(extract_readme_info "$readme_file" "$folder_name" "$run_name")"
                # Escape pipes and newlines for markdown table
                files_list_clean=$(echo -e "$files_list" | sed ':a;N;$!ba;s/\n/<br>/g' | sed 's/|/\\|/g')
                echo "| \`${folder_name}\` | ${total_size} | ${parts} | ${files_list_clean} | ${run_date} |" >> downloads/README.md
              fi
            done
            echo "" >> downloads/README.md
          done

          echo "---" >> downloads/README.md
          echo "*This tool is provided as is*" >> downloads/README.md

          echo "downloads/README.md created with detailed run information"

          # Also update the repository's root README.md
          SECTION_TITLE="Downloaded files in your GitHub repository :"

          if [ ! -f "README.md" ]; then
            echo "# GitHub File Downloader" > README.md
            echo "" >> README.md
            echo "Download files directly into your repository using GitHub Actions." >> README.md
            echo "" >> README.md
          fi

          sed -i "/$SECTION_TITLE/,/---$/d" README.md 2>/dev/null || true
          sed -i '/^$/d' README.md

          {
            echo ""
            echo "---"
            echo ""
            echo "## $SECTION_TITLE"
            echo ""
            COUNTER=1
            for run_folder in downloads/*/; do
              [ -d "$run_folder" ] || continue
              run_name=$(basename "$run_folder")
              run_encoded=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$run_name")
              echo "${COUNTER}. [$run_name]($REPO_URL/$run_encoded)"
              echo ""
              COUNTER=$((COUNTER + 1))
            done
            echo "---"
          } >> README.md

          echo "Root README.md updated with download links"

      # --- Step 6: Incremental Commit & Push ---
      - name: Incremental Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "Incremental Push Mode"
          echo "This method pushes files in batches to avoid timeout issues"
          echo ""

          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)
          echo "Total files to push: $BACKUP_FILE_COUNT"

          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "No files in backup directory, checking downloads folder..."
            DOWNLOAD_FILE_COUNT=$(find downloads -type f 2>/dev/null | wc -l)
            if [ "$DOWNLOAD_FILE_COUNT" -eq 0 ]; then
              echo "Nothing to push"
              exit 0
            fi
          fi

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          regenerate_downloads_readme() {
            # Already generated in previous step, but ensure it's present
            if [ ! -f "downloads/README.md" ]; then
              echo "# Downloaded list :" > downloads/README.md
              echo "" >> downloads/README.md
              for folder in downloads/*/; do
                [ -d "$folder" ] || continue
                FOLDER_NAME=$(basename "$folder")
                FOLDER_ENCODED=$(urlencode "$FOLDER_NAME")
                printf -- "- [%s](./%s)\n" "$FOLDER_NAME" "$FOLDER_ENCODED" >> downloads/README.md
              done
              echo "" >> downloads/README.md
              echo "---" >> downloads/README.md
              echo "*This tool is provided as is*" >> downloads/README.md
            fi
          }

          push_batch() {
            local BATCH_SIZE=3
            local FILES=("$@")
            local BATCH_COUNT=0
            local BATCH_FILES=()
            local TOTAL_PUSHED=0
            local TOTAL_FILES=${#FILES[@]}

            for FILE in "${FILES[@]}"; do
              BATCH_FILES+=("$FILE")
              BATCH_COUNT=$((BATCH_COUNT + 1))

              if [ $BATCH_COUNT -ge $BATCH_SIZE ]; then
                TOTAL_PUSHED=$((TOTAL_PUSHED + BATCH_COUNT))
                echo ""
                echo ">>> Pushing batch ($TOTAL_PUSHED/$TOTAL_FILES files)..."

                git fetch origin "$BRANCH" --quiet 2>/dev/null || true
                git reset --hard origin/"$BRANCH" 2>/dev/null || true

                mkdir -p downloads
                cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true

                for BF in "${BATCH_FILES[@]}"; do
                  git add -f "$BF" 2>/dev/null || true
                done

                if ! git diff --cached --quiet 2>/dev/null; then
                  git commit -m "[GitHub Action] Add batch of $BATCH_COUNT files [skip ci]" --quiet 2>/dev/null || true

                  local PUSH_RETRY=0
                  local PUSH_SUCCESS=false
                  while [ $PUSH_RETRY -lt 5 ]; do
                    PUSH_RETRY=$((PUSH_RETRY + 1))
                    if timeout 180 git push origin HEAD:"$BRANCH" 2>&1; then
                      PUSH_SUCCESS=true
                      echo "    Batch pushed successfully!"
                      break
                    else
                      echo "    Batch push failed, attempt $PUSH_RETRY/5..."
                      git fetch origin "$BRANCH" --quiet 2>/dev/null || true
                      git reset --hard origin/"$BRANCH" 2>/dev/null || true
                      mkdir -p downloads
                      cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true
                      for BF in "${BATCH_FILES[@]}"; do
                        git add -f "$BF" 2>/dev/null || true
                      done
                      if ! git diff --cached --quiet 2>/dev/null; then
                        git commit -m "[GitHub Action] Add batch of $BATCH_COUNT files [skip ci]" --quiet 2>/dev/null || true
                      fi
                      sleep $((3 + RANDOM % 7))
                    fi
                  done

                  if [ "$PUSH_SUCCESS" = false ]; then
                    echo "    WARNING: Batch push failed after 5 attempts"
                  fi
                fi

                BATCH_FILES=()
                BATCH_COUNT=0
                sleep 2
              fi
            done

            if [ ${#BATCH_FILES[@]} -gt 0 ]; then
              TOTAL_PUSHED=$((TOTAL_PUSHED + ${#BATCH_FILES[@]}))
              echo ""
              echo ">>> Pushing final batch ($TOTAL_PUSHED/$TOTAL_FILES files)..."

              git fetch origin "$BRANCH" --quiet 2>/dev/null || true
              git reset --hard origin/"$BRANCH" 2>/dev/null || true
              mkdir -p downloads
              cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true

              for BF in "${BATCH_FILES[@]}"; do
                git add -f "$BF" 2>/dev/null || true
              done

              if ! git diff --cached --quiet 2>/dev/null; then
                git commit -m "[GitHub Action] Add final batch [skip ci]" --quiet 2>/dev/null || true

                local PUSH_RETRY=0
                while [ $PUSH_RETRY -lt 5 ]; do
                  PUSH_RETRY=$((PUSH_RETRY + 1))
                  if timeout 180 git push origin HEAD:"$BRANCH" 2>&1; then
                    echo "    Final batch pushed successfully!"
                    break
                  else
                    echo "    Push failed, attempt $PUSH_RETRY/5..."
                    sleep $((3 + RANDOM % 7))
                    git fetch origin "$BRANCH" --quiet 2>/dev/null || true
                    git reset --hard origin/"$BRANCH" 2>/dev/null || true
                    mkdir -p downloads
                    cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true
                    for BF in "${BATCH_FILES[@]}"; do
                      git add -f "$BF" 2>/dev/null || true
                    done
                    if ! git diff --cached --quiet 2>/dev/null; then
                      git commit -m "[GitHub Action] Add final batch [skip ci]" --quiet 2>/dev/null || true
                    fi
                  fi
                done
              fi
            fi
          }

          echo ""
          echo "=========================================="
          echo "Starting incremental push process..."
          echo "=========================================="

          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"

          mkdir -p downloads
          cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true

          echo "Analyzing files to push..."
          ALL_FILES=()

          while IFS= read -r -d '' FILE; do
            ALL_FILES+=("$FILE")
          done < <(find downloads -name "README.md" -print0 2>/dev/null)

          while IFS= read -r -d '' FILE; do
            ALL_FILES+=("$FILE")
          done < <(find downloads -type f \( -name "*.7z" -o -name "*.7z.*" -o -name "*.mp4" -o -name "*.mp3" -o -name "*.m4a" -o -name "*.exe" -o -name "*.iso" -o -name "*.tar*" -o -name "*.rar" \) -print0 2>/dev/null | sort -z)

          TOTAL_FILES=${#ALL_FILES[@]}
          echo "Found $TOTAL_FILES files to push"
          echo ""

          if [ $TOTAL_FILES -eq 0 ]; then
            git add README.md 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "[GitHub Action] Update README [skip ci]"
              timeout 120 git push origin HEAD:"$BRANCH" || true
            fi
            echo "No download files to push!"
            exit 0
          fi

          TOTAL_SIZE=0
          for F in "${ALL_FILES[@]}"; do
            if [ -f "$F" ]; then
              FSIZE=$(stat -c%s "$F" 2>/dev/null || echo 0)
              TOTAL_SIZE=$((TOTAL_SIZE + FSIZE))
            fi
          done
          TOTAL_SIZE_MB=$((TOTAL_SIZE / 1024 / 1024))
          echo "Total size: ${TOTAL_SIZE_MB}MB"
          echo ""

          if [ $TOTAL_SIZE_MB -lt 100 ]; then
            echo "Small upload - pushing all at once..."

            git add -f -A downloads/
            git add README.md

            if ! git diff --cached --quiet; then
              git commit -m "[GitHub Action] Downloaded files [skip ci]"

              PUSH_RETRY=0
              while [ $PUSH_RETRY -lt 10 ]; do
                PUSH_RETRY=$((PUSH_RETRY + 1))
                if timeout 300 git push origin HEAD:"$BRANCH"; then
                  echo "Push successful!"
                  break
                else
                  echo "Push failed, retry $PUSH_RETRY/10..."
                  sleep $((3 + RANDOM % 7))
                  git fetch origin "$BRANCH"
                  git reset --hard origin/"$BRANCH"
                  mkdir -p downloads
                  cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true
                  git add -f -A downloads/
                  git add README.md
                  if ! git diff --cached --quiet; then
                    git commit -m "[GitHub Action] Downloaded files [skip ci]"
                  fi
                fi
              done
            fi

          else
            echo "Large upload (${TOTAL_SIZE_MB}MB) - using incremental batch push..."
            echo ""

            push_batch "${ALL_FILES[@]}"

            echo ""
            echo "Pushing README files..."
            git fetch origin "$BRANCH" --quiet 2>/dev/null || true
            git reset --hard origin/"$BRANCH" 2>/dev/null || true
            mkdir -p downloads
            cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true

            regenerate_downloads_readme
            git add -f downloads/README.md
            git add README.md

            if ! git diff --cached --quiet 2>/dev/null; then
              git commit -m "[GitHub Action] Update download list [skip ci]" --quiet 2>/dev/null || true

              PUSH_RETRY=0
              while [ $PUSH_RETRY -lt 5 ]; do
                PUSH_RETRY=$((PUSH_RETRY + 1))
                if timeout 60 git push origin HEAD:"$BRANCH" 2>&1; then
                  echo "README pushed!"
                  break
                else
                  echo "README push failed, retry $PUSH_RETRY/5..."
                  sleep 3
                fi
              done
            fi
          fi

          echo ""
          echo "=========================================="
          echo "All files pushed successfully!"
          echo "=========================================="
